name: CI Pipeline

on:
  push:
    branches: [master, main, develop, staging]
  pull_request:
    branches: [master, main]
  workflow_call:
    inputs:
      # When true (the prod deploy calls it this way), run ONLY the fast unit
      # tests that actually gate a release — skip coverage re-runs, Playwright
      # e2e, and security scans. Those still run in full on every PR/push, just
      # not on the prod critical path. Cuts several minutes off each deploy.
      fast:
        type: boolean
        default: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          # Run the suite against the real Postgres service (above), not SQLite,
          # so PG-only behaviour (ARRAY columns, native FK enforcement, partial
          # unique indexes, type mismatches) is exercised in CI.
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_academy
        run: |
          cd backend
          pytest -v --tb=short

      - name: Security scan backend
        if: ${{ inputs.fast != true }}
        run: |
          pip install bandit
          bandit -r backend/app/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        if: ${{ inputs.fast != true }}
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # Typecheck and lint are gating (no continue-on-error) and run on the
      # fast path too — they take seconds and catch a whole class of bug that
      # the unit suite cannot see.
      - name: Typecheck frontend
        run: |
          cd frontend
          npm run typecheck

      # Gates on errors. Pre-existing violations of three rules are demoted to
      # warnings and capped by --max-warnings (see frontend/eslint.config.mjs);
      # the cap only moves down.
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint:ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:unit

      - name: Generate frontend coverage report
        if: ${{ inputs.fast != true }}
        run: |
          cd frontend
          npm run test:coverage
        continue-on-error: true

      - name: Upload frontend coverage
        if: ${{ inputs.fast != true && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Install Playwright browsers
        id: playwright-install
        if: ${{ inputs.fast != true }}
        run: |
          cd frontend
          npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run frontend e2e tests
        if: ${{ inputs.fast != true && steps.playwright-install.outcome == 'success' }}
        run: |
          cd frontend
          npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: ${{ inputs.fast != true && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Security scan frontend
        if: ${{ inputs.fast != true }}
        run: |
          cd frontend
          npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        if: ${{ inputs.fast != true }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
