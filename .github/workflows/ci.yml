name: CI Pipeline

on:
  push:
    branches: [master, main, develop, staging]
  pull_request:
    branches: [master, main]
  workflow_call: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          # Run the suite against the real Postgres service (above), not SQLite,
          # so PG-only behaviour (ARRAY columns, native FK enforcement, partial
          # unique indexes, type mismatches) is exercised in CI.
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_academy
        run: |
          cd backend
          pytest -v --tb=short

      - name: Security scan backend
        run: |
          pip install bandit
          bandit -r backend/app/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:unit

      - name: Generate frontend coverage report
        run: |
          cd frontend
          npm run test:coverage
        continue-on-error: true

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Install Playwright browsers
        id: playwright-install
        run: |
          cd frontend
          npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run frontend e2e tests
        if: steps.playwright-install.outcome == 'success'
        run: |
          cd frontend
          npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Security scan frontend
        run: |
          cd frontend
          npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
