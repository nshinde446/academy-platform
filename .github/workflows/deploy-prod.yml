name: Deploy / production

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

jobs:
  # Re-run the unit tests as a gate, even though CI ran on the PR.
  # Prevents shipping a master commit that someone pushed directly without PR.
  # Runs IN PARALLEL with the image build below — only the deploy job waits on it.
  # `fast: true` runs ONLY the unit suites (backend pytest + frontend vitest) and
  # skips coverage/e2e/security scans — those gate quality on PRs, not releases —
  # taking several minutes off the deploy's critical path.
  gate-tests:
    uses: ./.github/workflows/ci.yml
    with:
      fast: true

  # Backend + frontend images build in SEPARATE jobs so they run on parallel
  # runners, concurrently with gate-tests. Images are tagged by SHA, so building
  # a commit that later fails the gate is harmless — the deploy job is what
  # actually ships, and it waits for the gate. This takes both the test run and
  # the other image off each build's critical path.
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Persist Next.js's incremental build cache (.next/cache) across runs.
      # The Docker layer cache can't help — any source change invalidates the
      # `npm run build` layer — so we restore the cache dir here, inject it into
      # the BuildKit cache mount the Dockerfile declares, and the dance action's
      # post step extracts the updated cache back out for actions/cache to save.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: nextjs-build-cache
          key: nextjs-build-cache-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-build-cache-${{ hashFiles('frontend/package-lock.json') }}-
            nextjs-build-cache-

      - name: Inject Next.js cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {
              "nextjs-build-cache": "/app/.next/cache"
            }

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Ship it. Waits on BOTH the test gate and BOTH image builds, plus the
  # `production` environment's required-reviewer approval. Builds above run
  # without waiting for approval (cheap, harmless); the actual prod mutation
  # — this SSH deploy — is what the approval gate protects.
  deploy:
    needs: [gate-tests, build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: production   # protect with required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /srv/academy/repo
            git fetch --depth=1 origin master
            git reset --hard origin/master
            export GHCR_USER='${{ github.actor }}'
            export GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}'
            bash infra/scripts/deploy.sh prod \
                ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} \
                ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            # Reclaim disk from superseded images now the new ones are running.
            # Runs only after a successful deploy (set -e above), so the just-
            # deployed images (in use) are kept and the previous deploys' images
            # are pruned — the disk-full deploy failure was these piling up.
            docker image prune -af
