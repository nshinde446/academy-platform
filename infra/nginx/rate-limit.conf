# Shared rate-limit zones. Place in /etc/nginx/conf.d/ so the zones are defined
# at http{} scope and usable from every server block.
#
# Two zones:
#   - auth_limit  : tight, slows credential-stuffing on /api/v1/auth/*
#   - api_limit   : generous, for normal authenticated traffic
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;

# Staging variants — tighter, since staging shouldn't see real load anyway.
limit_req_zone $binary_remote_addr zone=staging_auth_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=staging_api_limit:10m  rate=20r/s;
