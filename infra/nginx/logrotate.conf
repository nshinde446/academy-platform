# nginx access/error log rotation. Install to /etc/logrotate.d/nginx
# (Debian/Ubuntu nginx packages ship a default; this overrides with tighter
# retention + compression).
#
# Test before relying on it:
#   sudo logrotate -d /etc/logrotate.d/nginx

/var/log/nginx/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 `cat /var/run/nginx.pid`
        fi
    endscript
}
