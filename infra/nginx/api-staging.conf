# Staging API reverse proxy. Mirrors prod but proxies to port 8001 and uses
# the `staging_*` rate-limit zones.

server {
    listen 80;
    listen [::]:80;
    server_name staging-api.example.com;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;  # keep staging out of search

    client_max_body_size 25M;

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=staging_auth_limit burst=6 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        limit_req zone=staging_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
