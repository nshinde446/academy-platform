# Production API reverse proxy.
# Install to /etc/nginx/sites-available/api-prod.conf and symlink into sites-enabled/.
# Reload with `sudo nginx -t && sudo systemctl reload nginx`.
#
# Before you have a domain: replace `api.example.com` with the bare server IP
# and access via http://<ip>/. After certbot, the listen 443 block below is
# added automatically and you change `listen 80` to a 301 to https.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 25M;  # syllabus xlsx imports

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

# Once TLS is provisioned via certbot, an additional `server { listen 443 ssl; ... }`
# block is appended here. The block above should then 301 to https.
