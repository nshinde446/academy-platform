# Production stack — runs as the `academy-prod` compose project.
#
# Run from the repo root on the VPS:
#   docker compose -p academy-prod \
#     -f infra/compose/docker-compose.prod.yml \
#     --env-file infra/compose/.env.prod \
#     up -d --pull=always
#
# Migration runs as a one-shot `migrate` service before `backend` starts,
# so the new app code never sees an old schema (and vice versa).

name: academy-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NEVER expose 5432 to the public internet. Only the bridge network needs it.
    # Add `ports: ["127.0.0.1:5432:5432"]` only if you genuinely need host access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Grace window before failed probes count: Postgres may need to run crash
      # recovery on boot (e.g. after a disk-full or unclean shutdown) and won't
      # accept connections until it finishes. Without this the deploy's
      # `--wait`/service_healthy gate gave up mid-recovery and failed the deploy.
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    image: ${BACKEND_IMAGE}
    restart: "no"
    env_file: .env.prod
    depends_on:
      db: { condition: service_healthy }
    command: ["alembic", "upgrade", "head"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Persist uploaded study material onto a host-mounted directory so
      # files survive container restarts / image swaps. The volume below
      # mounts the same path into the container. See M1 design notes in
      # docs/study-material-and-question-bank.md.
      STUDY_MATERIAL_ROOT: /study_material
    volumes:
      - /srv/academy/study_material:/study_material
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      # Bound to localhost only — public traffic comes via host nginx.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # BioMax R6 face terminals ack on case-sensitive response headers, which Caddy
  # (Go) canonicalises and thereby breaks — so the device cannot be served
  # through it. This stdlib-only proxy speaks the device's dialect on its own
  # port and forwards to `backend` for ingest. It exposes ONLY /AIData.aspx, so
  # the rest of the API is never reachable over plain HTTP. Point the device's
  # push settings at <server-ip>:8099. See docs/biomax-attendance.md.
  aidata-proxy:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "-u", "/app/aidata_proxy.py"]
    environment:
      AIDATA_UPSTREAM: http://backend:8000/AIData.aspx
      AIDATA_PORT: "8099"
      # HTTPS listener for the device in Domain Name + HTTPS mode. TLS is
      # terminated HERE, not by Caddy — Caddy canonicalises the case-sensitive
      # ack headers and breaks the device. Caddy still ISSUES/renews the cert
      # (add the host to /etc/caddy/Caddyfile); we mount its cert files below.
      AIDATA_TLS_PORT: "8443"
      AIDATA_TLS_CERT: /certs/acme-v02.api.letsencrypt.org-directory/attend.eduworld-livekit.duckdns.org/attend.eduworld-livekit.duckdns.org.crt
      AIDATA_TLS_KEY: /certs/acme-v02.api.letsencrypt.org-directory/attend.eduworld-livekit.duckdns.org/attend.eduworld-livekit.duckdns.org.key
      # Liveness heartbeat — bumped on every device contact; the host-side
      # attendance_watchdog.py reads it and alerts when it goes stale.
      AIDATA_HEARTBEAT_FILE: /srv/academy/aidata/heartbeat
      # CAPTURE MODE ONLY — leave UNSET in production. Set to BioMax's own
      # SmartOffice receiver to relay the device's traffic through it and log
      # SmartOffice's server->device commands (Phase 2 provisioning oracle; see
      # docs/biomax-provisioning-implementation.md §0). Biometric blobs are
      # redacted in the capture log. Recreate this one service to flip it, then
      # unset + recreate to return to normal ingest.
      # AIDATA_RELAY_UPSTREAM: http://103.171.50.109:8080/AIData.aspx
    volumes:
      - ../aidata-proxy/aidata_proxy.py:/app/aidata_proxy.py:ro
      # Caddy's cert store (read-only). Container runs as root, so it can read
      # caddy's 0600 key despite the caddy:caddy ownership.
      - /var/lib/caddy/.local/share/caddy/certificates:/certs:ro
      # Heartbeat dir shared with the host watchdog (cron reads it there).
      - /srv/academy/aidata:/srv/academy/aidata
    depends_on:
      backend: { condition: service_healthy }
    ports:
      # Public on purpose — the terminal pushes here directly. Plain HTTP on
      # 8099 (proven fallback), HTTPS on 8443 (Domain Name mode). Payload is
      # just an ID + timestamp and the backend still enforces its dev_id
      # allowlist.
      - "8099:8099"
      - "8443:8443"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Worker may run ingest pipelines that read/write files via the
      # same StorageBackend abstraction — keep paths consistent.
      STUDY_MATERIAL_ROOT: /study_material
    volumes:
      - /srv/academy/study_material:/study_material
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # The Celery app lives at app.core.jobs.celery_app:celery_app. This pointed
    # at `app.worker`, a module that has never existed, so the container failed
    # on start and restart:unless-stopped looped it forever (RestartCount was 30
    # in prod, ~4 weeks in staging). Nothing caught it: deploy.sh waits only on
    # the backend healthcheck, and the post-deploy probes only hit
    # backend/frontend. Every background task has therefore never run.
    #
    # Deliberately WITHOUT `-B`. Adding the beat scheduler also starts the
    # nightly absent sweep, which writes attendance rows for real students —
    # that is a production behaviour change that deserves its own decision, not
    # a side effect of fixing a crash loop. See docs/git-and-deploy-workflow.md.
    command: ["celery", "-A", "app.core.jobs.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    # Override the image's inherited HEALTHCHECK. backend/Dockerfile defines a
    # `curl http://127.0.0.1:8000/health` probe for the web server; the worker
    # runs no HTTP server, so that probe can never pass and the container sat
    # permanently `unhealthy` the moment it finally started. Ask Celery instead:
    # `inspect ping` against this container's own node returns 0 only if the
    # worker is alive and talking to the broker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.jobs.celery_app.celery_app inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # next.config.ts uses this to proxy /api/* requests server-side.
      # Pointing at the internal `backend` service skips the public TLS round-trip.
      API_BASE_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  redis_data:
