global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://api:8000/api/v1/notifications/webhook/alertmanager"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://api:8000/api/v1/notifications/webhook/alertmanager"
        send_resolved: true
