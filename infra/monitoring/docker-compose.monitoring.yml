# Monitoring stack — Prometheus, Alertmanager, Grafana, Flower, exporters.
#
# Run from the repo root on the VPS:
#   docker compose -p academy-monitoring \
#     -f infra/monitoring/docker-compose.monitoring.yml up -d
#
# All ports bind to 127.0.0.1 only — these endpoints are NEVER exposed to
# the public internet. To reach them from your laptop, SSH tunnel:
#   ssh -L 3001:127.0.0.1:3001 -L 9090:127.0.0.1:9090 \
#       -L 9093:127.0.0.1:9093 -L 5555:127.0.0.1:5555 user@<vps-ip>
# then open http://127.0.0.1:3001 in your browser.

name: academy-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      # Default to admin/admin only if the env vars below aren't set. Set them
      # in a non-committed .env file next to this compose file before starting:
      #   GF_SECURITY_ADMIN_USER=admin
      #   GF_SECURITY_ADMIN_PASSWORD=<long random string>
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/platform_overview.json
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    volumes:
      - ./flower/flowerconfig.py:/flowerconfig.py
      - flower_data:/data
    command: celery --broker=redis://redis:6379/0 flower --conf=/flowerconfig.py
    ports:
      - "127.0.0.1:5555:5555"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      # DATA_SOURCE_NAME must NOT contain a literal password in a committed
      # file. Set it in a non-committed .env next to this compose file:
      #   POSTGRES_EXPORTER_DSN=postgresql://user:pw@host:5432/db?sslmode=disable
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN}
    ports:
      - "127.0.0.1:9187:9187"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "127.0.0.1:9121:9121"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  flower_data:
