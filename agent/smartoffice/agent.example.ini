# SmartOffice attendance agent — configuration.
# Copy this file to agent.ini and fill in the values. agent.ini is gitignored
# (it holds secrets); this example is safe to commit.

[sql]
# The agent runs ON the SmartOffice PC, so connect over localhost. Use the
# READ-ONLY login the provider creates for you — never the SA account.
driver = ODBC Driver 17 for SQL Server
server = localhost
database = SmartOfficedb
username = academy_reader
password = CHANGE_ME
trust_server_certificate = true
encrypt = false
# Alternatively, put a full ODBC string here and the parts above are ignored:
# odbc_connection_string = DRIVER={ODBC Driver 17 for SQL Server};SERVER=localhost;DATABASE=SmartOfficedb;UID=academy_reader;PWD=...;TrustServerCertificate=yes;

[source]
# The table or VIEW the provider exposes (schema-qualified is fine).
table = dbo.DeviceLogs
# Column that identifies the student (matched to Student.rfid_number on the server).
employee_code_column = EmployeeCode
# The punch timestamp column (device-local time).
timestamp_column = LogDate
# STRONGLY PREFERRED: a monotonically increasing column (IDENTITY / rowversion)
# for exact incremental reads. If set, it is used as the cursor instead of time.
id_column = Id
# Optional columns (leave blank if the table doesn't have them).
serial_column = SerialNumber
direction_column = PunchDirection
# Max rows pulled per cycle.
batch_size = 500

[backend]
# Base URL of the Academy backend (public HTTPS).
url = https://your-academy-domain.example
# Shared secret — must equal SMARTOFFICE_INGEST_TOKEN on the server.
token = CHANGE_ME_LONG_RANDOM
# Branch these punches belong to. Leave blank to use the server's
# SMARTOFFICE_BRANCH_ID default.
branch_id =
verify_tls = true
timeout_seconds = 30

[agent]
poll_interval_seconds = 20
watermark_file = watermark.json
